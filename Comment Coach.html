<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comment Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: short header, joke tabs, then stage (left) + two sentence boxes (right), stacking on phones. Few words, big type. */
:root{
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#eef0f8; --ink:#1d2340; --muted:#5a6080; --line:#dce0ef;
  --accent:#5b4fd6; --accent-ink:#ffffff;
  --like:#d63c74; --idea:#178a5f; --star:#f2a900; --warn:#c8283d;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152a; --surface:#1a1f3c; --surface-2:#232a50; --ink:#eef0fb; --muted:#a6acd0; --line:#2e3563;
  --accent:#9b91ff; --accent-ink:#14172e; --like:#ff7aa8; --idea:#4fd3a0; --star:#ffc53d; --warn:#ff6b7d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12152a; --surface:#1a1f3c; --surface-2:#232a50; --ink:#eef0fb; --muted:#a6acd0; --line:#2e3563;
  --accent:#9b91ff; --accent-ink:#14172e; --like:#ff7aa8; --idea:#4fd3a0; --star:#ffc53d; --warn:#ff6b7d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,5vw,2.7rem);font-weight:700}
h2{font-size:1.45rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}

header{display:grid;gap:12px}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px}
.steps b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--display);font-weight:600;font-size:1rem;padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-size:.9rem;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .num{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.tab .score{font-family:var(--body);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.workspace{grid-template-columns:minmax(0,1fr)}}
.stage-card,.coach{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px;min-width:0}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.maker{font-size:.95rem;color:var(--muted)}
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;border:3px solid var(--line);background:#fff}
.stage canvas{display:block;width:100%;height:100%}
.play-overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,#10132a 28%,transparent);border:0;cursor:pointer;font:inherit}
.play-overlay span{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1d2340;font-family:var(--display);font-weight:600;font-size:1.25rem;padding:12px 24px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.flag{width:24px;height:24px}
.controls{display:flex;gap:10px;align-items:center}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-family:var(--display);font-weight:600;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-size:1.15rem;padding:12px 22px}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.watch{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:1.1rem}
.watch svg{flex:none;width:26px;height:26px}

.sentence{border:2px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:14px;display:grid;gap:10px}
.s-like{--c:var(--like)} .s-idea{--c:var(--idea)}
.s-head{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--c)}
.s-head svg{width:28px;height:28px;flex:none}
.writer{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.prefix{font-family:var(--display);font-weight:600;font-size:1.15rem;white-space:nowrap}
.writer input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.end{font-family:var(--display);font-weight:600;font-size:1.15rem}
.switch{display:flex;flex-wrap:wrap;gap:6px}
.switch button{appearance:none;font:inherit;font-family:var(--display);font-weight:600;font-size:.98rem;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--idea);border-color:var(--idea);color:var(--accent-ink)}
.help{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem;color:var(--muted)}
.chip{appearance:none;border:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.95rem;padding:3px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--c);color:var(--c)}

.result{display:grid;gap:12px;border-top:2px dashed var(--line);padding-top:14px}
.big{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big h3{font-size:1.5rem}
.stars{display:inline-flex;gap:3px}
.stars svg{width:30px;height:30px}
.stars.sm svg{width:24px;height:24px}
.on{fill:var(--star)} .off{fill:none;stroke:var(--line);stroke-width:2}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:6px solid var(--c);font-size:1.05rem}
.fb p{min-width:0}
@media (max-width:420px){.fb{grid-template-columns:minmax(0,1fr)}}
.warn{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:2px solid var(--warn);color:var(--ink)}
.warn svg{width:40px;height:40px;flex:none;color:var(--warn)}
.warn h3{font-size:1.4rem;color:var(--warn)}
.said{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.05rem;overflow-wrap:anywhere}
details.model{border-radius:10px;border:1.5px solid var(--line);padding:10px 14px}
details.model summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem}
details.model[open] summary{margin-bottom:10px}

</style>

<div class="wrap">
  <header>

    <ol class="steps">

      <li><b>2</b>Write 2 sentences</li>

  <section class="workspace">

    </div>

    <div class="coach">
      <div class="sentence s-like">
        <div class="s-head"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="currentColor"/></svg>Something you like</div>
        <div class="writer"><label class="prefix" for="likeIn">I really like</label><input id="likeIn" autocomplete="off"><span class="end">.</span></div>
        <div class="help" id="likeHelp"></div>
      </div>

      <div class="sentence s-idea">
        <div class="s-head"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z" fill="currentColor"/><rect x="9" y="19.5" width="6" height="2.5" rx="1" fill="currentColor"/></svg>An idea to make it better</div>
        <div class="switch" role="group" aria-label="Choose a sentence start">
          <button type="button" id="m-next" aria-pressed="true">Next time you could…</button>
          <button type="button" id="m-have" aria-pressed="false">Have you thought about…?</button>
        </div>
        <div class="writer"><label class="prefix" for="ideaIn" id="ideaPrefix">Next time you could</label><input id="ideaIn" autocomplete="off"><span class="end" id="ideaEnd">.</span></div>
        <div class="help" id="ideaHelp"></div>
      </div>

      <div><button class="btn btn-primary" id="check" type="button">Check my comment</button></div>
      <div class="result" id="result" hidden></div>
    </div>
  </section>

</div>

// lines: [speaker, text, start, end]. A newer line from the same speaker replaces the old one (like a Scratch say block).
function makeJoke(cfg){
  return function(t){
    BACK[cfg.back](cfg.still?0:t);
    const showing=[null,null];
    cfg.lines.forEach(l=>{if(t>=l[2]&&t<l[3])showing[l[0]]=l;});
    [0,1].forEach(i=>{
      const [x,y]=cfg.pos[i];const L=cfg.laugh&&cfg.laugh[i]!=null&&t>=cfg.laugh[i];
      let dy=0;if(!cfg.still){if(L)dy=-Math.abs(Math.sin(t*9))*10;else if(showing[i])dy=-Math.abs(Math.sin(t*7))*3;}
      CHAR[cfg.chars[i]](x,y+dy,L,t);});
    [0,1].forEach(i=>{const l=showing[i];if(l){const tl=cfg.tails[i];bubble(tl[0],tl[1],l[1],tl[2]);}});
  };
}

/* ---------- kindness check ---------- */
// Unkind words. Matching ignores capitals, repeated letters (stuuupid), number swaps (stup1d) and word endings.
const MEAN=["bad","boring","bored","bore","rubbish","terrible","stupid","ugly","hate","worst","worse","suck","sucks","lame","dumb","awful","trash","horrible","pointless","annoying","cringe","cringy","cringey","poor","idiot","idiotic","loser","noob","newbie","babyish","garbage","stink","stinks","stinky","gross","ew","yuck","yucky","disgusting","useless","lazy","fail","failure","pathetic","dull","meh","nerd","freak","moron","dork","clown","ugh","crybaby","worthless","fake","nonsense","mess","messy","ruin","ruined","embarrassing","shame","weak","waste",
  "damn","crap","crappy","shit","shitty","fuck","fucking","bitch","bastard","ass","arse","dick","piss","wtf","stfu","omfg","hell"];
// Unkind phrases (after the same clean-up).
const MEAN_PHRASES=["you suck","u suck","you can't","you cant","you cannot","give up","stop making","never make","don't make","dont make","delete it","delete this","nobody likes","no one likes","nobody cares","who cares","shut up","get good","git gud","learn to code","learn how to code","waste of time","try harder","do better","lol no","so bad","too bad","what is this","what even","are you serious","my little brother","a baby could","even a baby","you are bad","your bad","ur bad","you're bad","are bad at","made me sad","made me bored","fell asleep","sleep","zzz"];
// Sneaky "I really like…" answers that turn praise into an insult.
const SARCASM=["nothing","none","none of it","no part","no parts","not a thing","that it ended","it's over","it is over","it was over","that it's over","that it finished","turning it off","turn it off","stop watching","not watching","nobody","no one"];
const NEGATED=/\b(not|isn'?t|isnt|wasn'?t|wasnt|don'?t|dont|didn'?t|didnt|doesn'?t|doesnt|never|no|aren'?t|arent|can'?t|cant|nothing)\s+(?:very\s+|really\s+|that\s+|so\s+|even\s+|at\s+all\s+)?(good|funny|fun|nice|cool|like|liked|enjoy|enjoyed|clever|great|interesting|cute|smart|laugh|laughed|amazing|okay|ok)\b/;
const LEET={"0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","@":"a","$":"s","€":"e"};
function clean(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[013457@$€]/g,c=>LEET[c])
  .replace(/[^a-z' ]+/g," ").replace(/\s+/g," ").trim();}
function stretch(w){ // "bad" -> b+a+d+ so "baaad" matches; double letters keep needing two
  let out="",i=0;while(i<w.length){const c=w[i];let n=1;while(w[i+n]===c)n++;
    out+=c==="'"?"'?":c===" "?"\\s+":(c+(n>1?"{"+n+",}":"+"));i+=n;}return out;}
const MEAN_RE=new RegExp("\\b(?:"+MEAN.map(stretch).join("|")+")(?:s|es|ed|ing|y|ey|er|est)?\\b");
const PHRASE_RE=new RegExp("\\b(?:"+MEAN_PHRASES.map(stretch).join("|")+")\\b");
const SARC_RE=new RegExp("\\b(?:"+SARCASM.map(stretch).join("|")+")\\b");
// Letters squashed together catch "s t u p i d" and "s.t.u.p.i.d" (long words only, to avoid false alarms).
const SQUASH=["stupid","idiot","rubbish","garbage","boring","terrible","horrible","pathetic","useless","disgusting","cringe","fuck","shit","bitch","bastard","worthless","moron"];
function unkind(text,isLike){
  if(!text)return false;const c=clean(text);
  if(MEAN_RE.test(c)||PHRASE_RE.test(c)||NEGATED.test(c))return true;
  if(isLike&&SARC_RE.test(c))return true;
  const squashed=c.replace(/[^a-z]/g,"").replace(/([a-z])\1+/g,"$1");
  if(/\b(?:[a-z][\s.\-_*]+){3,}[a-z]\b/i.test(text)) // only when letters are spaced out
    return SQUASH.some(w=>squashed.includes(w.replace(/([a-z])\1+/g,"$1")));
  return false;
}

/* ---------- scoring ---------- */
const WHY=["because","so","funny","cool","great","nice","clever","good","fun","amazing","awesome","beautiful","cute","brilliant","best","favourite","favorite","love","laugh","colourful","colorful","smooth"];
const SCRATCH=["sprite","backdrop","background","costume","block","speech bubble","bubble","character","colour","color","sound","animation","ending","title","joke","stage"];
const HOW=["wait","block","say for","seconds","second","secs","costume","order","swap","change","move","glide","broadcast","slower","longer","switch","add","use","bounce","jump","hide","sound"];
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");}
function has(text,list){return list.some(w=>new RegExp("\\b"+reEsc(w)+"(?:s|d|ed|es|ing|ly)?\\b","i").test(text));}
function wordsIn(s){return (s.match(/[A-Za-z0-9'’]+/g)||[]).length;}
function scoreLike(s,ex){
  const w=wordsIn(s);if(w<1)return {stars:0,msg:"Write what you like."};
  let st=1;const what=has(s,ex.topic.concat(SCRATCH));const why=has(s,WHY)&&w>=3;
  if(what)st++;if(why)st++;
  if(st===3)return {stars:3,msg:"Great! You said what and why."};
  if(!what)return {stars:st,msg:"What do you like? Try: "+ex.likeWords.slice(0,2).join(" or ")+"."};
  return {stars:st,msg:"Good! Now say why: \"because…\""};
}
function scoreIdea(s,ex){
  const w=wordsIn(s);if(w<1)return {stars:0,msg:"Write one idea."};
  let st=1;const prob=has(s,ex.flaw);const how=has(s,HOW)&&w>=2;
  if(prob)st++;if(how)st++;
  if(st===3)return {stars:3,msg:"Great! A clear idea to fix the problem."};
  if(!prob)return {stars:st,msg:ex.look};
  return {stars:st,msg:"Good! How can they fix it? Try a Scratch block."};
}

function frame(t){EX[cur].draw(t);$("progress").style.width=Math.min(100,t/EX[cur].dur*100)+"%";}
function loop(now){const t=(now-t0)/1000;if(t>=EX[cur].dur){frame(EX[cur].dur);stop(true);return;}frame(t);raf=requestAnimationFrame(loop);}
function play(){cancelAnimationFrame(raf);$("overlay").hidden=true;t0=performance.now();raf=requestAnimationFrame(loop);}
function stop(ended){cancelAnimationFrame(raf);if(ended){$("overlay").hidden=false;$("overlay-text").textContent="Watch again";}}
$("overlay").onclick=play;$("restart").onclick=play;

function draft(){return drafts[EX[cur].id]||(drafts[EX[cur].id]={like:"",idea:"",mode:"next"});}
function save(){store.set("drafts",drafts);}
function setMode(m){const d=draft();d.mode=m;save();
  $("m-next").setAttribute("aria-pressed",m==="next");$("m-have").setAttribute("aria-pressed",m==="have");
  $("ideaPrefix").textContent=PREFIX[m][0];$("ideaEnd").textContent=PREFIX[m][1];}
$("m-next").onclick=()=>setMode("next");$("m-have").onclick=()=>setMode("have");
$("likeIn").oninput=e=>{draft().like=e.target.value;save();};
$("ideaIn").oninput=e=>{draft().idea=e.target.value;save();};

function chips(box,words,input,key){
  box.innerHTML='<span>Word help:</span>';
  words.forEach(w=>{const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=w;
    c.onclick=()=>{const v=input.value;input.value=(v&&!/\s$/.test(v)?v+" ":v)+w;draft()[key]=input.value;save();input.focus();};box.appendChild(c);});
}
function select(i){
  stop(false);cur=i;const ex=EX[i],d=draft();
  $("ex-title").textContent=ex.title;$("ex-maker").textContent=ex.maker;$("ex-watch").textContent=ex.watch;
  canvas.setAttribute("aria-label",ex.aria);$("overlay").hidden=false;$("overlay-text").textContent="Play";
  frame(ex.poster);$("progress").style.width="0%";
  $("likeIn").value=d.like;$("ideaIn").value=d.idea;setMode(d.mode);
  chips($("likeHelp"),ex.likeWords.concat(["because"]),$("likeIn"),"like");
  chips($("ideaHelp"),IDEA_WORDS.concat(["so"]),$("ideaIn"),"idea");
  $("result").hidden=true;renderTabs();
}

$("check").onclick=()=>{
  const ex=EX[cur],d=draft(),box=$("result");box.hidden=false;
  const like=$("likeIn").value.trim().replace(/[.!]+$/,""),idea=$("ideaIn").value.trim().replace(/[.?!]+$/,"");
  const badLike=unkind(like,true),badIdea=unkind(idea,false);
  if(badLike||badIdea){
    box.innerHTML='<div class="warn" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z" fill="currentColor"/><rect x="11" y="9" width="2" height="6" rx="1" fill="var(--surface)"/><circle cx="12" cy="17.5" r="1.2" fill="var(--surface)"/></svg><div><h3>Stop and think.</h3><p>This could hurt someone\'s feelings.</p></div></div>'+
     '<div class="fb s-'+(badLike?'like':'idea')+'"><p><b>'+(badLike?'I really like…':'Your idea')+'</b> is not kind.</p></div>'+
     '<p class="said">Be kind. Use kind words. Then press <b>Check my comment</b> again.</p>';
    (badLike?$("likeIn"):$("ideaIn")).focus();return;
  }
  const a=scoreLike(like,ex),b=scoreIdea(idea,ex),n=a.stars+b.stars;
  best[ex.id]=Math.max(best[ex.id]||0,n);store.set("best",best);renderTabs();
  const P=PREFIX[d.mode];
  const said=(like?"I really like "+like+". ":"")+(idea?P[0]+" "+idea+P[1]:"");
  box.innerHTML='<div class="big">'+stars(n,6)+'<h3>'+verdict(n)+'</h3></div>'+
   '<div class="fb s-like">'+stars(a.stars,3,true)+'<p>'+esc(a.msg)+'</p></div>'+
   '<div class="fb s-idea">'+stars(b.stars,3,true)+'<p>'+esc(b.msg)+'</p></div>'+
   (said?'<p class="said">'+esc(said)+'</p>':"")+
   '<details class="model"><summary>See a good example</summary><p class="said">I really like '+esc(ex.model[0])+'. '+(ex.id==="banana"?"Have you thought about ":"Next time you could ")+esc(ex.model[1])+(ex.id==="banana"?"?":".")+'</p></details>'+
   (cur<EX.length-1?'<div><button class="btn btn-ghost" type="button" id="next">Next joke →</button></div>':'<p class="muted">Last joke! Click a number at the top to try again.</p>');
  const nx=$("next");if(nx)nx.onclick=()=>{select(cur+1);window.scrollTo({top:tabs.offsetTop-10,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});};
};

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>select(cur));
select(0);
})();
</script>

</body></html>
